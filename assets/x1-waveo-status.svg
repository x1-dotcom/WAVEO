<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-label="WAVEO public RC status">
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050b10"/><stop offset="1" stop-color="#08131b"/></linearGradient></defs>
  <rect width="1600" height="360" rx="24" fill="url(#bg)"/>
  <text x="70" y="66" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="6" fill="#6f98a8">X1 // RELEASE DISCIPLINE</text>
  <text x="70" y="118" font-family="Arial Black,Arial,sans-serif" font-size="40" fill="#ffffff">SOURCE, TESTS AND RUNTIME ARE DIFFERENT STATES.</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="70" y="165" width="330" height="116" rx="18" fill="#07151c" stroke="#1d4e60"/>
    <text x="98" y="202" font-size="15" letter-spacing="4" fill="#7193a0">REPOSITORY</text>
    <text x="98" y="246" font-size="28" font-weight="700" fill="#17e9ff">PUBLIC</text>
    <rect x="430" y="165" width="330" height="116" rx="18" fill="#07151c" stroke="#1d4e60"/>
    <text x="458" y="202" font-size="15" letter-spacing="4" fill="#7193a0">VERSION</text>
    <text x="458" y="246" font-size="28" font-weight="700" fill="#ffffff">v1.4 PUBLIC RC</text>
    <rect x="790" y="165" width="330" height="116" rx="18" fill="#07151c" stroke="#1d4e60"/>
    <text x="818" y="202" font-size="15" letter-spacing="4" fill="#7193a0">SOURCE</text>
    <text x="818" y="246" font-size="28" font-weight="700" fill="#17e9ff">PUBLISHED</text>
    <rect x="1150" y="165" width="380" height="116" rx="18" fill="#07151c" stroke="#1d4e60"/>
    <text x="1178" y="202" font-size="15" letter-spacing="4" fill="#7193a0">RUNTIME CLAIM</text>
    <text x="1178" y="246" font-size="28" font-weight="700" fill="#a9bbc3">VERIFY PER ENVIRONMENT</text>
  </g>
  <text x="70" y="325" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#7fa0ad">Public source exists. Compatibility and deployment behavior still require environment-specific validation.</text>
</svg>